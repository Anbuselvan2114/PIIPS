<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg2)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Monogram "P": stem + bowl, built as one solid glyph so it reads
       cleanly even at 16px favicon size -->
  <g fill="url(#mark)">
    <rect x="176" y="132" width="56" height="248" rx="20"/>
    <path d="M216 132 H288 A76 76 0 0 1 288 284 H216 V132 Z
              M232 176 V240 H288 A32 32 0 0 0 288 176 H232 Z" fill-rule="evenodd"/>
  </g>

  <!-- precision point: the "counter" of the P doubles as a target dot -->
  <circle cx="260" cy="208" r="9" fill="#1e1b4b"/>

  <!-- three short ledger notches trailing the stem: invoice line-items -->
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="176" y="330" width="34" height="10" rx="5"/>
    <rect x="176" y="350" width="50" height="10" rx="5"/>
    <rect x="176" y="370" width="42" height="10" rx="5"/>
  </g>
</svg>
